[build]
  command = "node build.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# 后台不进搜索引擎
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# 内容与配置不对外当静态资源暴露
[[headers]]
  for = "/content/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
