<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>作品集后台</title>
  <link rel="stylesheet" href="./theme.css">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <style>
    /* 后台加载完成前的占位，避免白屏 */
    body{margin:0;background:#24272d;color:#9ba2ae;font:14px/1.7 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
    #boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
    #boot b{display:block;color:#eaedf2;font-size:15px;margin-bottom:6px}
    noscript{color:#ff7a4d}
  </style>
</head>
<body>
  <div id="boot"><div><b>正在加载后台…</b>登录后即可增删作品、改文案、填 B 站链接</div></div>
  <noscript><p style="padding:24px">后台需要 JavaScript，请换用 Chrome / Edge 打开。</p></noscript>

  <!-- Decap CMS 只在后台加载，公共页面不引用 -->
  <script src="./decap-cms.js"></script>
  <script>
    // CMS 接管后隐藏占位
    window.addEventListener("load", () => {
      setTimeout(() => {
        const b = document.getElementById("boot");
        if (b) b.remove();
      }, 1200);
    });
  </script>
</body>
</html>
